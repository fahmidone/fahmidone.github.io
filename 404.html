<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost the Thread | fahmid.me</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');

        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Synced Animations */
        @keyframes paw-bat {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(-40deg); } /* Wind up */
            25% { transform: rotate(20deg); }  /* Strike */
            35% { transform: rotate(0deg); }   /* Return */
        }

        @keyframes ball-roll {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(0) rotate(0deg); } /* Wait for paw strike */
            35% { transform: translateX(120px) rotate(360deg); } /* Roll away */
            60% { transform: translateX(120px) rotate(360deg); } /* Pause */
            80% { transform: translateX(0) rotate(-180deg); } /* Slowly return */
        }

        @keyframes gradient-drift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .animate-paw {
            transform-origin: 65px 75px;
            animation: paw-bat 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .animate-ball {
            animation: ball-roll 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-animate {
            background-size: 200% 200%;
            animation: gradient-drift 15s ease infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-[#0b0e14] to-blue-950 text-slate-200 h-screen w-full flex flex-col items-center justify-center overflow-hidden bg-animate">

    <div class="relative w-80 h-64 flex flex-col justify-end items-center mb-6">

        </svg>

        <div class="animate-ball absolute bottom-2 left-[55%] z-0">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-pink-600 to-rose-400 shadow-[0_0_15px_rgba(244,63,94,0.6)] relative overflow-hidden flex items-center justify-center">
                <div class="absolute top-1 left-1 w-2 h-2 bg-white rounded-full opacity-60"></div>

    </div>

    <div class="text-center z-10 px-6">
